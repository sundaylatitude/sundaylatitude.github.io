<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sunday Latitude</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #F5F4F0;
      --foreground: #474747;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background-color: var(--background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      background-color: var(--background);
      color: var(--foreground);
      font-family: "Inter", Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 680px;
      text-align: left;
    }

    .intro-copy {
      margin-bottom: 40px;
    }

    .headline {
      max-width: 640px;
      margin: 0 0 30px;

      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.2rem, 5vw, 3.65rem);
      font-weight: 400;
      line-height: 1.16;
      letter-spacing: -0.015em;
    }

    .supporting-copy {
      max-width: 590px;
      margin: 0 0 20px;

      font-family: "Inter", Arial, sans-serif;
      font-size: 1.08rem;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0;
    }

    .supporting-copy:last-child {
      margin-bottom: 0;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 52px;
      padding: 15px 30px;
      border: 1px solid var(--foreground);

      background-color: var(--foreground);
      color: var(--background);

      font-family: "Inter", Arial, sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.025em;
      text-decoration: none;

      transition:
        background-color 0.2s ease,
        color 0.2s ease,
        opacity 0.2s ease;
    }

    .button:hover {
      background-color: var(--background);
      color: var(--foreground);
    }

    .button:focus-visible {
      outline: 2px solid var(--foreground);
      outline-offset: 4px;
    }

    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 72px 22px 40px;
      }

      .headline {
        margin-bottom: 26px;
        font-size: 2.25rem;
        line-height: 1.18;
      }

      .supporting-copy {
        font-size: 1rem;
        line-height: 1.65;
        margin-bottom: 18px;
      }

      .intro-copy {
        margin-bottom: 32px;
      }

      .button {
        width: 100%;
        min-height: 54px;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="intro-copy">
      <h1 class="headline">
        The ultimate luxury is having more choice over your time.
      </h1>

      <p class="supporting-copy">
        Sunday Latitude explores the possibility of building a flexible online
        business alongside your current life.
      </p>

      <p class="supporting-copy">
        Continue to learn more about the opportunity and decide whether it may
        be right for you.
      </p>
    </div>

    <a
      href="https://www.sundaylatitude.com"
      class="button"
    >
      Explore the Opportunity
    </a>
  </main>
</body>
</html>
