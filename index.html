<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sunday Latitude</title>

  <!-- Arc logo favicon -->
  <link rel="icon" type="image/png" href="/favicon.png">

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background-color: #F8F7F4;
      color: #2A2C2D;
      font-family: "Playfair Display", serif;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    .intro-copy p {
      display: block;
      margin-top: 0;
      margin-bottom: 28px;

      font-size: 1.55rem;
      font-weight: normal;
      line-height: 1.55;
    }

    .intro-copy .opening-line {
      font-size: 2.1rem;
      line-height: 1.4;
    }

    .intro-copy p:last-child {
      margin-bottom: 42px;
    }

    .button {
      display: inline-block;
      padding: 14px 34px;

      background-color: #2A2C2D;
      color: #F8F7F4;

      font-size: 1.05rem;
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .button:hover,
    .button:focus {
      opacity: 0.82;
    }

    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding-top: 70px;
      }

      .intro-copy p {
        margin-bottom: 22px;
        font-size: 1.2rem;
      }

      .intro-copy .opening-line {
        font-size: 1.7rem;
      }

      .button {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="intro-copy">

      <p class="opening-line">
        The ultimate luxury is having more choice over your time.
      </p>

      <p>
        Sunday Latitude explores the possibility of building a flexible online
        business alongside your current life.
      </p>

      <p>
        Continue to learn more about the opportunity and decide whether it may
        be right for you.
      </p>

    </div>

    <a
      href="https://www.sundaylatitude.com"
      class="button"
    >
      Explore the Opportunity
    </a>

  </main>
</body>
</html>
